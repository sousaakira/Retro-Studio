# Compila o editor do Retro Studio para Linux e monta o pacote (retro_studio/empacotar.sh).
# - Todo envio para a main (e todo pull request para ela): o pacote fica para baixar na página da
#   execução, em "Artifacts".
# - Tag v* (ex.: v1.0.0, igual ao retro_studio_version do version.py): além disso, publica os pacotes
#   numa Release do GitHub, marcada como a mais recente. As notas saem de retro_studio/notas-de-versao/<tag>.md.
#   (As tags até a v0.16.0 são do Retro Studio em Electron, que continua na branch electron.)
# Cache: a compilação reaproveita o cache do SCons da main (o GitHub só deixa uma tag usar o cache da
# branch padrão). Para a Release sair rápida, envie a main, espere esta execução terminar e só depois
# crie a tag; não cancele a execução da main, que é ela que deixa o cache pronto.
# O pacote sai sem o kit SGDK/MarsDev e sem o BlastEm; o instalar.sh baixa os dois.
name: Retro Studio

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Mudança só em texto não recompila (nas tags, o GitHub ignora este filtro).
    paths-ignore:
      - "**.md"
      - "retro_studio/docs/**"
      - "retro_studio/pacote/aur/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "retro_studio/docs/**"
      - "retro_studio/pacote/aur/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    # Uma versão do Ubuntu mais antiga para o binário rodar em mais distribuições (glibc mais velha).
    runs-on: ubuntu-22.04
    name: Linux (editor + pacote)
    timeout-minutes: 150
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          # O resto (X11, Wayland, ALSA, PulseAudio) o Godot carrega em tempo de execução, sem cabeçalhos do sistema.
          sudo apt-get install libwayland-bin

      - name: Restaurar o cache da compilação
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: retro-studio-linux
        continue-on-error: true

      - name: Python e SCons
        uses: ./.github/actions/godot-deps

      - name: Compilar o editor
        run: |
          # O perfil do Retro Studio (retro_studio.py) é lido pelo SConstruct; o editor sai em bin/retro-studio.
          scons platform=linuxbsd target=editor debug_symbols=no "cache_path=${{ github.workspace }}/.scons_cache/" redirect_build_objects=no
          ls -l bin/

      - name: Salvar o cache da compilação
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: retro-studio-linux
        continue-on-error: true

      - name: Teste rápido do editor
        run: bin/retro-studio --version

      - name: Montar o pacote
        env:
          # O Temurin do runner: o jlink tira dele um Java mínimo, com as bibliotecas de imagem embutidas.
          JDK_ORIGEM: ${{ env.JAVA_HOME_21_X64 }}
        run: retro_studio/empacotar.sh pacote

      - name: Guardar o pacote na execução
        uses: actions/upload-artifact@v7
        with:
          name: retro-studio-linux-x86_64
          path: pacote/*.tar.gz
          # O .tar.gz já é compactado.
          compression-level: 0
          retention-days: 30

  instalacao:
    # Instala o pacote como um usuário novo: sem Java e sem make no sistema, numa pasta pessoal vazia.
    # O instalador baixa o kit e o BlastEm do servidor e, no fim, compila uma ROM de teste.
    needs: linux
    runs-on: ubuntu-22.04
    name: Instalação num Ubuntu sem Java e sem make
    timeout-minutes: 30
    steps:
      - name: Baixar o pacote da execução
        uses: actions/download-artifact@v8
        with:
          name: retro-studio-linux-x86_64
          path: pacote

      - name: Tirar o Java e o make do sistema
        run: |
          sudo rm -f /usr/bin/java /usr/bin/make /usr/local/bin/make
          for variavel in $(env | awk -F= '/^JAVA_HOME/ { print $1 }'); do echo "$variavel=" >> "$GITHUB_ENV"; done
          ! command -v java && ! command -v make

      - name: Kit e emulador do servidor (cache)
        uses: actions/cache@v6
        with:
          path: casa/.retrostudio
          key: retro-studio-kit-marsdev-blastem-v1

      - name: Instalar
        run: |
          export HOME="$GITHUB_WORKSPACE/casa" RETRO_STUDIO_SEM_PERGUNTAS=1
          mkdir -p "$HOME"
          tar -xzf pacote/*.tar.gz
          ./retro-studio-*-linux-x86_64/instalar.sh

      - name: Conferir
        run: |
          export HOME="$GITHUB_WORKSPACE/casa"
          "$HOME/.local/share/retro-studio/instalar.sh" --verificar
          "$HOME/.local/share/retro-studio/retro-studio" --version
          # O make de um projeto, num terminal, acha o Java pelo kit (o instalador o liga em m68k-elf/bin).
          cp -r "$HOME/.local/share/retro-studio/teste_kit" teste
          PATH="$HOME/.local/share/retro-studio/kit/bin:$PATH" make -C teste
          test -s teste/out/rom.bin

  windows-editor:
    # O editor para Windows, compilado no Linux com o mingw-w64 (gcc 13, threads posix) e o ANGLE: sem
    # OpenGL 3.3 (máquina virtual, placa de vídeo antiga), o editor desenha pelo Direct3D 11. O ANGLE
    # usa o módulo astcenc, que o perfil do Retro Studio desliga no Linux.
    runs-on: ubuntu-24.04
    name: Windows (editor)
    timeout-minutes: 150
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Restaurar o cache da compilação
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: retro-studio-windows
        continue-on-error: true

      - name: Python e SCons
        uses: ./.github/actions/godot-deps

      - name: ANGLE (bibliotecas oficiais do Godot)
        run: python misc/scripts/install_angle.py

      - name: Compilar o editor
        run: |
          scons platform=windows target=editor use_mingw=yes d3d12=no debug_symbols=no angle=yes module_astcenc_enabled=yes \
            "angle_libs=${{ github.workspace }}/bin/build_deps/angle" "cache_path=${{ github.workspace }}/.scons_cache/" redirect_build_objects=no
          ls -l bin/

      - name: Salvar o cache da compilação
        if: always()
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: retro-studio-windows
        continue-on-error: true

      - name: Guardar o editor
        uses: actions/upload-artifact@v7
        with:
          name: retro-studio-windows-editor
          path: |
            bin/godot.windows.editor.x86_64.exe
            bin/godot.windows.editor.x86_64.console.exe
          retention-days: 3

  windows-pacote:
    # Monta o pacote num Windows de verdade (compila a libmd.a e confere o kit com as ferramentas .exe) e
    # instala como um usuário novo, numa pasta de usuário vazia, conferindo com uma ROM de teste.
    needs: windows-editor
    runs-on: windows-latest
    name: Windows (pacote e instalação)
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SGDK_URL: https://github.com/Stephane-D/SGDK/releases/download/v2.11/sgdk211.7z
      SGDK_SHA256: 5cc704b7e3a15183c33e721a1d7f84c067cf78808754556d03bb14764df51437
      BLASTEM_URL: https://www.retrodev.com/blastem/nightlies/blastem-win64-1.0.1-pre-d22b34e78040.zip
      BLASTEM_SHA256: c6aa7294e4b4fd6b31f0b14ac518b1b165cd0e84fb92be98ab0fcc456e8b14bc
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Baixar o editor
        uses: actions/download-artifact@v8
        with:
          name: retro-studio-windows-editor
          path: editor

      - name: Componentes (cache)
        id: componentes
        uses: actions/cache@v6
        with:
          path: componentes
          key: retro-studio-windows-componentes-v1-${{ env.SGDK_SHA256 }}-${{ env.BLASTEM_SHA256 }}

      - name: Baixar o SGDK, o BlastEm e o kit Linux (cabeçalhos e biblioteca do SGDK 1.81)
        if: steps.componentes.outputs.cache-hit != 'true'
        run: |
          mkdir -p componentes
          curl -fsSL -o componentes/sgdk211.7z "$SGDK_URL"
          curl -fsSL -o componentes/blastem.zip "$BLASTEM_URL"
          echo "$SGDK_SHA256  componentes/sgdk211.7z" | sha256sum -c -
          echo "$BLASTEM_SHA256  componentes/blastem.zip" | sha256sum -c -
          curl -fsSL -o marsdev.zip https://api.retrostudio.dev/packages/marsdev-linux-x64.zip
          7z x -y -omarsdev marsdev.zip >/dev/null
          mkdir -p componentes/marsdev/m68k-elf/bin
          for item in inc src res makefile.gen makelib.gen common.mk md.ld; do
            cp -r "marsdev/m68k-elf/$item" componentes/marsdev/m68k-elf/
          done
          cp marsdev/m68k-elf/bin/*.jar componentes/marsdev/m68k-elf/bin/
          rm -rf marsdev marsdev.zip

      - name: Montar o pacote
        run: |
          export EDITOR_EXE=editor/godot.windows.editor.x86_64.exe
          export EDITOR_CONSOLE_EXE=editor/godot.windows.editor.x86_64.console.exe
          export KIT_LINUX=componentes/marsdev/m68k-elf SGDK_7Z=componentes/sgdk211.7z BLASTEM_ZIP=componentes/blastem.zip
          export JDK_ORIGEM="$JAVA_HOME_21_X64"
          retro_studio/empacotar-windows.sh pacote

      - name: Instalar como um usuário novo
        shell: pwsh
        run: |
          $casa = Join-Path $env:RUNNER_TEMP 'usuario-novo'
          New-Item -ItemType Directory -Force $casa | Out-Null
          Expand-Archive (Get-ChildItem pacote/*.zip).FullName -DestinationPath instalacao
          $pasta = (Get-ChildItem instalacao -Directory)[0].FullName
          # Sem Java no PATH: o build tem de usar o Java do pacote.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'java|jdk|jre' }) -join ';'
          $env:USERPROFILE = $casa
          $env:LOCALAPPDATA = Join-Path $casa 'AppData\Local'
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$pasta\instalar.ps1"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:LOCALAPPDATA\Programs\RetroStudio\instalar.ps1" -Verificar
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:LOCALAPPDATA\Programs\RetroStudio\retro-studio.console.exe" --version

      - name: Guardar o pacote
        uses: actions/upload-artifact@v7
        with:
          name: retro-studio-windows-x86_64
          path: pacote/*.zip
          compression-level: 0
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, instalacao, windows-pacote]
    runs-on: ubuntu-22.04
    name: Publicar a Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Conferir a tag com a versão do version.py
        run: |
          versao="$(python3 -c 'import version; print(version.retro_studio_version)')"
          if [ "v$versao" != "${{ github.ref_name }}" ]; then
            echo "::error::A tag ${{ github.ref_name }} não bate com retro_studio_version = $versao no version.py."
            exit 1
          fi
          test -f "retro_studio/notas-de-versao/${{ github.ref_name }}.md" || {
            echo "::error::Faltam as notas em retro_studio/notas-de-versao/${{ github.ref_name }}.md."
            exit 1
          }

      - name: Baixar o pacote da execução
        uses: actions/download-artifact@v8
        with:
          name: retro-studio-linux-x86_64
          path: pacote

      - name: Baixar o pacote de Windows
        uses: actions/download-artifact@v8
        with:
          name: retro-studio-windows-x86_64
          path: pacote

      - name: Criar a Release com o pacote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" pacote/*.tar.gz pacote/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Retro Studio ${{ github.ref_name }}" \
            --notes-file "retro_studio/notas-de-versao/${{ github.ref_name }}.md" \
            --latest
